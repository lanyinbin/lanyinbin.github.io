<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>嘟嘟汽车博物馆 - 探索汽车的奥秘</title>
    <link rel="preconnect" href="https://fonts.loli.net">
    <link href="https://fonts.loli.net/css2?family=Noto+Sans+SC:wght@400;700;900&family=Fredoka+One&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary: #FF6B35; --secondary: #4ECDC4; --accent: #FFE66D;
            --dark: #2C3E50; --light: #F7F9FC; --glass: rgba(255,255,255,0.85);
        }
        body {
            font-family: 'Noto Sans SC', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            overflow: hidden; height: 100vh; width: 100vw;
        }

        /* ========== Loading ========== */
        .loading-screen {
            position: fixed; inset: 0; z-index: 9999;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            transition: opacity 0.6s;
        }
        .loading-screen.hidden { opacity: 0; pointer-events: none; }
        .loading-car {
            width: 100px; height: 60px;
            background: linear-gradient(135deg, var(--primary), #ff8c5a);
            border-radius: 20px 20px 8px 8px;
            position: relative;
            animation: car-bounce 1s ease-in-out infinite;
        }
        .loading-car::before, .loading-car::after {
            content: ''; position: absolute;
            width: 28px; height: 28px; bottom: -12px;
            background: var(--dark); border-radius: 50%;
            border: 3px solid #fff;
            animation: wheel-spin 0.8s linear infinite;
        }
        .loading-car::before { left: 12px; }
        .loading-car::after { right: 12px; }
        @keyframes car-bounce { 0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)} }
        @keyframes wheel-spin { to{transform:rotate(360deg)} }
        .loading-text {
            margin-top: 30px; color: #fff; font-size: 1.3rem;
            font-weight: 700; letter-spacing: 2px;
        }

        /* ========== Main Menu ========== */
        .main-menu {
            position: fixed; inset: 0; z-index: 100;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            background: linear-gradient(135deg, rgba(102,126,234,0.9), rgba(118,75,162,0.9));
            backdrop-filter: blur(10px);
            transition: transform 0.6s cubic-bezier(0.65,0,0.35,1);
        }
        .main-menu.hidden { transform: translateY(-100%); }
        .menu-title {
            font-size: 3.5rem; color: #fff; font-weight: 900;
            text-shadow: 0 4px 20px rgba(0,0,0,0.3);
            margin-bottom: 10px; text-align: center;
        }
        .menu-subtitle {
            font-size: 1.2rem; color: rgba(255,255,255,0.85);
            margin-bottom: 50px; text-align: center;
        }
        .menu-cards {
            display: flex; gap: 40px; flex-wrap: wrap;
            justify-content: center; max-width: 900px;
            padding: 0 20px;
        }
        .menu-card {
            width: 320px; height: 380px;
            background: var(--glass);
            border-radius: 30px; padding: 30px;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            cursor: pointer; transition: all 0.4s;
            border: 3px solid rgba(255,255,255,0.5);
            backdrop-filter: blur(12px);
            box-shadow: 0 20px 60px rgba(0,0,0,0.2);
        }
        .menu-card:hover {
            transform: translateY(-15px) scale(1.03);
            box-shadow: 0 30px 80px rgba(0,0,0,0.3);
            border-color: var(--accent);
        }
        .menu-card-icon {
            font-size: 5rem; margin-bottom: 20px;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.15));
        }
        .menu-card h2 {
            font-size: 1.8rem; color: var(--dark);
            margin-bottom: 10px; text-align: center;
        }
        .menu-card p {
            font-size: 1rem; color: #666;
            text-align: center; line-height: 1.6;
        }
        .menu-card-badge {
            margin-top: 15px; padding: 6px 16px;
            background: var(--secondary);
            color: #fff; border-radius: 20px;
            font-size: 0.85rem; font-weight: 700;
        }

        /* ========== Canvas ========== */
        #canvas-container {
            position: fixed; inset: 0; z-index: 1;
        }

        /* ========== Header ========== */
        .header {
            position: fixed; top: 0; left: 0; right: 0; z-index: 50;
            padding: 16px 30px; display: flex;
            justify-content: space-between; align-items: center;
            background: linear-gradient(180deg, rgba(0,0,0,0.5) 0%, transparent 100%);
            pointer-events: none;
        }
        .header > * { pointer-events: auto; }
        .header-logo {
            display: flex; align-items: center; gap: 12px;
            color: #fff; font-size: 1.4rem; font-weight: 900;
            text-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }
        .header-logo span { font-size: 2rem; }
        .back-btn {
            padding: 10px 20px; background: rgba(255,255,255,0.2);
            border: 2px solid rgba(255,255,255,0.4);
            color: #fff; border-radius: 25px; cursor: pointer;
            font-size: 1rem; font-weight: 700;
            transition: all 0.3s; backdrop-filter: blur(8px);
        }
        .back-btn:hover {
            background: rgba(255,255,255,0.35);
            transform: scale(1.05);
        }

        /* ========== Info Panel ========== */
        .info-panel {
            position: fixed; right: -450px; top: 80px;
            width: 400px; max-height: calc(100vh - 100px);
            background: var(--glass); border-radius: 24px;
            padding: 28px; z-index: 40; overflow-y: auto;
            backdrop-filter: blur(20px);
            border: 2px solid rgba(255,255,255,0.4);
            box-shadow: 0 20px 60px rgba(0,0,0,0.2);
            transition: right 0.5s cubic-bezier(0.34,1.56,0.64,1);
        }
        .info-panel.active { right: 20px; }
        .info-panel h2 {
            font-size: 1.6rem; color: var(--dark);
            margin-bottom: 6px; display: flex;
            align-items: center; gap: 10px;
        }
        .info-panel .en-name {
            font-family: 'Fredoka One', cursive;
            font-size: 1.1rem; color: var(--primary);
            margin-bottom: 16px; letter-spacing: 1px;
        }
        .info-panel .desc {
            font-size: 1rem; color: #444;
            line-height: 1.8; margin-bottom: 12px;
            padding: 14px; background: rgba(255,255,255,0.6);
            border-radius: 14px; border-left: 4px solid var(--secondary);
        }
        .info-panel .desc-en {
            font-size: 0.92rem; color: #666;
            line-height: 1.7; font-style: italic;
            padding: 14px; background: rgba(78,205,196,0.1);
            border-radius: 14px; border-left: 4px solid var(--secondary);
        }
        .info-close {
            position: absolute; top: 14px; right: 14px;
            width: 32px; height: 32px; border-radius: 50%;
            background: rgba(0,0,0,0.1); border: none;
            cursor: pointer; font-size: 1.2rem;
            transition: all 0.3s;
        }
        .info-close:hover { background: rgba(0,0,0,0.2); transform: rotate(90deg); }

        /* ========== Controls ========== */
        .controls {
            position: fixed; bottom: 30px; left: 50%;
            transform: translateX(-50%); z-index: 40;
            display: flex; gap: 16px; flex-wrap: wrap;
            justify-content: center;
        }
        .ctrl-btn {
            padding: 14px 28px; background: var(--glass);
            border: 2px solid rgba(255,255,255,0.5);
            border-radius: 30px; cursor: pointer;
            font-size: 1rem; font-weight: 700; color: var(--dark);
            transition: all 0.3s; backdrop-filter: blur(12px);
            display: flex; align-items: center; gap: 8px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.15);
        }
        .ctrl-btn:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 40px rgba(0,0,0,0.25);
            border-color: var(--accent);
        }
        .ctrl-btn.active {
            background: var(--secondary); color: #fff;
            border-color: var(--secondary);
        }

        /* ========== Progress ========== */
        .progress-bar {
            position: fixed; top: 80px; left: 20px; z-index: 40;
            background: var(--glass); border-radius: 20px;
            padding: 16px 22px; backdrop-filter: blur(12px);
            border: 2px solid rgba(255,255,255,0.4);
            box-shadow: 0 8px 30px rgba(0,0,0,0.15);
            min-width: 180px;
        }
        .progress-bar h4 {
            font-size: 0.9rem; color: var(--dark);
            margin-bottom: 10px;
        }
        .progress-track {
            width: 100%; height: 10px;
            background: rgba(0,0,0,0.1); border-radius: 5px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%; width: 0%;
            background: linear-gradient(90deg, var(--secondary), var(--primary));
            border-radius: 5px; transition: width 0.5s ease;
        }
        .progress-text {
            font-size: 0.8rem; color: #666;
            margin-top: 6px; text-align: center;
        }

        /* ========== Brand Quiz ========== */
        .quiz-panel {
            position: fixed; inset: 0; z-index: 60;
            display: none; align-items: center; justify-content: center;
            background: rgba(0,0,0,0.6); backdrop-filter: blur(8px);
        }
        .quiz-panel.active { display: flex; }
        .quiz-card {
            background: #fff; border-radius: 30px;
            padding: 40px; max-width: 600px; width: 90%;
            text-align: center; box-shadow: 0 30px 80px rgba(0,0,0,0.3);
            animation: quiz-pop 0.4s cubic-bezier(0.34,1.56,0.64,1);
        }
        @keyframes quiz-pop {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        .quiz-card h2 { font-size: 1.8rem; color: var(--dark); margin-bottom: 10px; }
        .quiz-card .quiz-en { font-family: 'Fredoka One', cursive; color: var(--primary); margin-bottom: 30px; }
        .quiz-options { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 24px; }
        .quiz-option {
            padding: 18px; background: var(--light);
            border: 3px solid transparent; border-radius: 18px;
            cursor: pointer; font-size: 1.2rem; font-weight: 700;
            color: var(--dark); transition: all 0.3s;
        }
        .quiz-option:hover { border-color: var(--secondary); transform: scale(1.03); }
        .quiz-option.correct { background: #d4edda; border-color: #28a745; color: #155724; }
        .quiz-option.wrong { background: #f8d7da; border-color: #dc3545; color: #721c24; }
        .quiz-result { font-size: 1.3rem; font-weight: 700; margin-top: 10px; }
        .quiz-next {
            padding: 12px 36px; background: var(--primary);
            color: #fff; border: none; border-radius: 25px;
            font-size: 1.1rem; font-weight: 700; cursor: pointer;
            transition: all 0.3s;
        }
        .quiz-next:hover { transform: scale(1.08); box-shadow: 0 8px 25px rgba(255,107,53,0.4); }

        /* ========== Celebration ========== */
        .celebration {
            position: fixed; inset: 0; z-index: 70;
            display: none; align-items: center; justify-content: center;
            background: rgba(0,0,0,0.4); backdrop-filter: blur(4px);
            pointer-events: none;
        }
        .celebration.active { display: flex; }
        .celebration-text {
            font-size: 3rem; color: #fff; font-weight: 900;
            text-shadow: 0 4px 20px rgba(0,0,0,0.3);
            animation: celebrate-bounce 0.6s ease infinite alternate;
        }
        @keyframes celebrate-bounce {
            from { transform: scale(1); }
            to { transform: scale(1.15); }
        }

        /* ========== Hint Toast ========== */
        .toast {
            position: fixed; top: 90px; left: 50%;
            transform: translateX(-50%) translateY(-100px); z-index: 55;
            background: var(--glass); padding: 14px 32px;
            border-radius: 30px; backdrop-filter: blur(12px);
            border: 2px solid rgba(255,255,255,0.5);
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            font-size: 1.1rem; font-weight: 700; color: var(--dark);
            transition: transform 0.4s cubic-bezier(0.34,1.56,0.64,1);
            pointer-events: none;
        }
        .toast.show { transform: translateX(-50%) translateY(0); }

        /* ========== Responsive ========== */
        @media (max-width: 768px) {
            .menu-title { font-size: 2.2rem; }
            .menu-cards { flex-direction: column; align-items: center; }
            .menu-card { width: 90%; height: auto; min-height: 280px; }
            .info-panel { width: 90%; right: -100%; left: 5%; top: auto; bottom: 100px; max-height: 50vh; }
            .info-panel.active { right: 5%; }
            .quiz-options { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <!-- Loading -->
    <div class="loading-screen" id="loadingScreen">
        <div class="loading-car"></div>
        <div class="loading-text">嘟嘟汽车博物馆加载中...</div>
    </div>

    <!-- Main Menu -->
    <div class="main-menu" id="mainMenu">
        <div class="menu-title">🚗 嘟嘟汽车博物馆</div>
        <div class="menu-subtitle">DUDU CAR MUSEUM — 探索汽车的奇妙世界</div>
        <div class="menu-cards">
            <div class="menu-card" onclick="enterBrandMuseum()">
                <div class="menu-card-icon">🏛️</div>
                <h2>品牌识别馆</h2>
                <p>认识世界各地的汽车品牌<br>学习它们的标志和故事</p>
                <div class="menu-card-badge">Brand Quiz + 3D Showroom</div>
            </div>
            <div class="menu-card" onclick="enterCarFactory()">
                <div class="menu-card-icon">🏭</div>
                <h2>汽车组装厂</h2>
                <p>拆解汽车零件，学习每个部件<br>动手组装属于自己的汽车</p>
                <div class="menu-card-badge">Disassemble & Assemble Game</div>
            </div>
        </div>
    </div>

    <!-- 3D Canvas -->
    <div id="canvas-container"></div>

    <!-- Header -->
    <div class="header" id="headerBar" style="display:none;">
        <div class="header-logo"><span>🚗</span>嘟嘟汽车博物馆</div>
        <button class="back-btn" onclick="backToMenu()">🏠 返回首页</button>
    </div>

    <!-- Info Panel -->
    <div class="info-panel" id="infoPanel">
        <button class="info-close" onclick="closeInfo()">✕</button>
        <h2 id="infoTitle">零件名称</h2>
        <div class="en-name" id="infoEn">Part Name</div>
        <div class="desc" id="infoDesc">中文介绍</div>
        <div class="desc-en" id="infoDescEn">English description</div>
    </div>

    <!-- Controls -->
    <div class="controls" id="controlsBar" style="display:none;">
        <button class="ctrl-btn" id="btnDisassemble" onclick="toggleDisassemble()">
            🔧 拆解汽车
        </button>
        <button class="ctrl-btn" id="btnAssemble" onclick="toggleAssemble()">
            🔩 组装模式
        </button>
        <button class="ctrl-btn" id="btnReset" onclick="resetCar()">
            🔄 重置视角
        </button>
        <button class="ctrl-btn" id="btnQuiz" onclick="startBrandQuiz()">
            ❓ 品牌问答
        </button>
    </div>

    <!-- Progress -->
    <div class="progress-bar" id="progressBar" style="display:none;">
        <h4>🎯 组装进度 Assembly Progress</h4>
        <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
        <div class="progress-text" id="progressText">0 / 12 个零件</div>
    </div>

    <!-- Quiz Panel -->
    <div class="quiz-panel" id="quizPanel">
        <div class="quiz-card" id="quizCard"></div>
    </div>

    <!-- Celebration -->
    <div class="celebration" id="celebration">
        <div class="celebration-text" id="celebrationText">🎉 太棒了！</div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    // ========== 初始化 Three.js ==========
    function initThree() {
        const container = document.getElementById('canvas-container');
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a2e);
        scene.fog = new THREE.FogExp2(0x1a1a2e, 0.015);

        camera = new THREE.PerspectiveCamera(50, window.innerWidth/window.innerHeight, 0.1, 1000);
        camera.position.set(8, 6, 10);

        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        container.appendChild(renderer.domElement);

        controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.minDistance = 5;
        controls.maxDistance = 30;

        raycaster = new THREE.Raycaster();
        mouse = new THREE.Vector2();

        // Lights
        const ambient = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambient);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(10, 15, 10);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        scene.add(dirLight);

        const spotLight = new THREE.SpotLight(0xFFE66D, 0.5);
        spotLight.position.set(-10, 10, -5);
        scene.add(spotLight);

        // Floor
        const floorGeo = new THREE.PlaneGeometry(60, 60);
        const floorMat = new THREE.MeshStandardMaterial({
            color: 0x222233,
            roughness: 0.8,
            metalness: 0.2
        });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.position.y = -0.5;
        floor.receiveShadow = true;
        scene.add(floor);

        // Grid
        const grid = new THREE.GridHelper(60, 60, 0x444455, 0x2a2a3a);
        grid.position.y = -0.49;
        scene.add(grid);

        window.addEventListener('resize', onWindowResize);
        renderer.domElement.addEventListener('click', onCanvasClick);
        renderer.domElement.addEventListener('mousemove', onCanvasMove);

        animate();
    }

    function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
        requestAnimationFrame(animate);
        if (controls) controls.update();

        // 品牌展台旋转（只旋转Logo）
        if (currentMode === 'brand') {
            brandMeshes.forEach((group, i) => {
                group.traverse(child => {
                    if (child.userData.isBrandLogo) {
                        child.rotation.y += 0.005 * (i % 2 === 0 ? 1 : -1);
                    }
                });
            });
        }

        // 汽车零件浮动动画（拆解状态）
        if (currentMode === 'factory' && disassembled) {
            const time = performance.now() * 0.001;
            carParts.forEach((part, i) => {
                if (part.userData.isExploded) {
                    part.position.y = part.userData.explodePos.y + Math.sin(time + i) * 0.1;
                }
            });
        }

        renderer.render(scene, camera);
    }

    function clearSceneObjects() {
        brandMeshes = [];
        carParts = [];
        selectedPart = null;
        disassembled = false;
        assembleMode = false;
        assembledCount = 0;

        // Remove all objects except lights and floor
        const toRemove = [];
        scene.traverse(child => {
            if (child.userData.isInteractive || child.userData.isBrand || child.userData.isCarPart) {
                toRemove.push(child);
            }
        });
        toRemove.forEach(obj => {
            if (obj.parent) obj.parent.remove(obj);
        });
    }

    // ========== 品牌Logo Canvas纹理 ==========
    function createBrandLogoTexture(brandId) {
        const canvas = document.createElement('canvas');
        canvas.width = 512; canvas.height = 512;
        const ctx = canvas.getContext('2d');
        const cx = 256, cy = 256, r = 220;

        if (brandId === 'bmw') {
            // 外圈黑色
            ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2);
            ctx.fillStyle = '#000'; ctx.fill(); ctx.lineWidth = 8;
            ctx.strokeStyle = '#silver'; ctx.stroke();
            // 银环
            ctx.beginPath(); ctx.arc(cx, cy, r-10, 0, Math.PI*2);
            ctx.lineWidth = 6; ctx.strokeStyle = '#C0C0C0'; ctx.stroke();
            // 蓝白扇形（旋转45度）
            for (let i = 0; i < 4; i++) {
                const start = i * Math.PI/2 - Math.PI/4;
                ctx.beginPath(); ctx.moveTo(cx, cy);
                ctx.arc(cx, cy, r-16, start, start + Math.PI/2);
                ctx.closePath();
                ctx.fillStyle = i % 2 === 0 ? '#0066B1' : '#FFFFFF';
                ctx.fill();
            }
            // 中心文字
            ctx.fillStyle = '#FFFFFF'; ctx.font = 'bold 42px sans-serif';
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillText('BMW', cx, cy + 4);
        } else if (brandId === 'mercedes') {
            // 银色渐变背景
            const grad = ctx.createRadialGradient(cx-60, cy-60, 20, cx, cy, r);
            grad.addColorStop(0, '#f0f0f0'); grad.addColorStop(0.5, '#c0c0c0'); grad.addColorStop(1, '#808080');
            ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2);
            ctx.fillStyle = grad; ctx.fill();
            ctx.lineWidth = 10; ctx.strokeStyle = '#fff'; ctx.stroke();
            // 三叉星
            ctx.strokeStyle = '#1a1a1a'; ctx.lineWidth = 18; ctx.lineCap = 'round';
            for (let i = 0; i < 3; i++) {
                const angle = i * (Math.PI * 2 / 3) - Math.PI/2;
                ctx.beginPath(); ctx.moveTo(cx, cy);
                ctx.lineTo(cx + Math.cos(angle) * (r-30), cy + Math.sin(angle) * (r-30));
                ctx.stroke();
            }
            // 中心圆
            ctx.beginPath(); ctx.arc(cx, cy, 28, 0, Math.PI*2);
            ctx.fillStyle = '#1a1a1a'; ctx.fill();
        } else if (brandId === 'audi') {
            // 白色背景
            ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, 512, 512);
            // 四个银环
            ctx.strokeStyle = '#A0A0A0'; ctx.lineWidth = 14;
            const ringR = 55, spacing = 110;
            for (let i = 0; i < 4; i++) {
                const rx = cx + (i - 1.5) * spacing;
                ctx.beginPath(); ctx.arc(rx, cy, ringR, 0, Math.PI*2); ctx.stroke();
            }
        } else if (brandId === 'toyota') {
            // 白色背景
            ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, 512, 512);
            // 红色椭圆轮廓
            ctx.strokeStyle = '#EB0A1E'; ctx.lineWidth = 18;
            ctx.beginPath(); ctx.ellipse(cx, cy, r-20, (r-20)*0.65, 0, 0, Math.PI*2);
            ctx.stroke();
            // 内部交叉椭圆
            ctx.lineWidth = 12;
            ctx.beginPath(); ctx.ellipse(cx-25, cy, 60, 80, -0.3, 0, Math.PI*2); ctx.stroke();
            ctx.beginPath(); ctx.ellipse(cx+25, cy, 60, 80, 0.3, 0, Math.PI*2); ctx.stroke();
            // 中心小椭圆
            ctx.beginPath(); ctx.ellipse(cx, cy-10, 35, 50, 0, 0, Math.PI*2); ctx.stroke();
            // 文字
            ctx.fillStyle = '#EB0A1E'; ctx.font = 'bold 36px sans-serif';
            ctx.textAlign = 'center'; ctx.fillText('TOYOTA', cx, cy + 130);
        } else if (brandId === 'byd') {
            // 红色椭圆背景
            ctx.fillStyle = '#E60012'; ctx.fillRect(0, 0, 512, 512);
            ctx.beginPath(); ctx.ellipse(cx, cy, r-10, (r-10)*0.55, 0, 0, Math.PI*2);
            ctx.fillStyle = '#fff'; ctx.fill();
            // BYD 文字
            ctx.fillStyle = '#E60012'; ctx.font = 'bold 120px sans-serif';
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillText('BYD', cx, cy + 8);
            // 外圈
            ctx.strokeStyle = '#E60012'; ctx.lineWidth = 10;
            ctx.beginPath(); ctx.ellipse(cx, cy, r-10, (r-10)*0.55, 0, 0, Math.PI*2); ctx.stroke();
        } else if (brandId === 'tesla') {
            // 红色盾形背景
            ctx.fillStyle = '#CC0000'; ctx.fillRect(0, 0, 512, 512);
            // 盾形
            ctx.beginPath();
            ctx.moveTo(cx, 30); ctx.lineTo(cx + r*0.9, 100);
            ctx.quadraticCurveTo(cx + r*0.95, cy, cx + r*0.75, 480);
            ctx.lineTo(cx - r*0.75, 480);
            ctx.quadraticCurveTo(cx - r*0.95, cy, cx - r*0.9, 100);
            ctx.closePath();
            ctx.fillStyle = '#fff'; ctx.fill();
            // T型
            ctx.strokeStyle = '#000'; ctx.lineWidth = 24; ctx.lineCap = 'round';
            ctx.beginPath(); ctx.moveTo(cx - 80, cy - 40); ctx.lineTo(cx + 80, cy - 40); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(cx, cy - 40); ctx.lineTo(cx, cy + 100); ctx.stroke();
            // 顶部弧线装饰
            ctx.strokeStyle = '#000'; ctx.lineWidth = 6;
            ctx.beginPath(); ctx.arc(cx, cy - 40, 50, Math.PI, 0); ctx.stroke();
        }

        const texture = new THREE.CanvasTexture(canvas);
        texture.anisotropy = 16;
        return texture;
    }

    // ========== 品牌识别馆 ==========
    function createBrandShowroom() {
        const spacing = 7;
        const startX = -(BRANDS.length - 1) * spacing / 2;

        BRANDS.forEach((brand, i) => {
            const group = new THREE.Group();
            group.userData.isBrand = true;
            group.userData.brand = brand;

            // 展台底座
            const baseGeo = new THREE.CylinderGeometry(2.5, 2.8, 0.4, 32);
            const baseMat = new THREE.MeshStandardMaterial({ color: 0x333344, roughness: 0.5 });
            const base = new THREE.Mesh(baseGeo, baseMat);
            base.position.y = 0.2;
            base.receiveShadow = true;
            group.add(base);

            // 展台光环
            const ringGeo = new THREE.TorusGeometry(2.6, 0.05, 16, 64);
            const ringMat = new THREE.MeshBasicMaterial({ color: brand.color });
            const ring = new THREE.Mesh(ringGeo, ringMat);
            ring.rotation.x = Math.PI / 2;
            ring.position.y = 0.42;
            group.add(ring);

            // 品牌标识（Canvas纹理精细绘制）
            const logoTexture = createBrandLogoTexture(brand.id);
            const logoGeo = new THREE.PlaneGeometry(2.8, 2.8);
            const logoMat = new THREE.MeshBasicMaterial({
                map: logoTexture, transparent: true, side: THREE.DoubleSide
            });
            const logoMesh = new THREE.Mesh(logoGeo, logoMat);
            logoMesh.position.y = 2.5;
            logoMesh.rotation.x = -Math.PI / 6;
            logoMesh.userData.isBrandLogo = true;
            group.add(logoMesh);

            // 汽车模型（简化）
            const carMesh = createBrandCar(brand.color, brand.accent);
            carMesh.position.y = 1.2;
            group.add(carMesh);

            // 品牌名称标签（3D文字替代）
            const labelGeo = new THREE.BoxGeometry(2.5, 0.5, 0.1);
            const labelMat = new THREE.MeshStandardMaterial({ color: 0x222233 });
            const label = new THREE.Mesh(labelGeo, labelMat);
            label.position.y = 0.6;
            group.add(label);

            group.position.set(startX + i * spacing, 0, 0);
            scene.add(group);
            brandMeshes.push(group);
        });
    }

    function createBrandCar(bodyColor, accentColor) {
        const car = new THREE.Group();
        const bodyMat = new THREE.MeshStandardMaterial({ color: bodyColor, metalness: 0.5, roughness: 0.25 });
        const glassMat = new THREE.MeshStandardMaterial({ color: 0x446688, transparent: true, opacity: 0.35, metalness: 0.9, roughness: 0.05 });
        const rubberMat = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.9 });
        const rimMat = new THREE.MeshStandardMaterial({ color: 0xcccccc, metalness: 0.8, roughness: 0.2 });
        const blackMat = new THREE.MeshStandardMaterial({ color: 0x111111, metalness: 0.3, roughness: 0.5 });

        // ===== 车身主体（流线型，用多个分段Box模拟曲面） =====
        // 前引擎盖
        const hoodGeo = new THREE.BoxGeometry(0.8, 0.45, 1.05);
        const hood = new THREE.Mesh(hoodGeo, bodyMat);
        hood.position.set(0.85, 0.55, 0);
        hood.castShadow = true; car.add(hood);

        // 驾驶舱主体
        const cabinGeo = new THREE.BoxGeometry(1.4, 0.6, 1.0);
        const cabin = new THREE.Mesh(cabinGeo, bodyMat);
        cabin.position.set(-0.05, 0.65, 0);
        cabin.castShadow = true; car.add(cabin);

        // 后备箱
        const trunkGeo = new THREE.BoxGeometry(0.7, 0.5, 1.0);
        const trunk = new THREE.Mesh(trunkGeo, bodyMat);
        trunk.position.set(-0.95, 0.58, 0);
        trunk.castShadow = true; car.add(trunk);

        // 车顶（圆顶感）
        const roofGeo = new THREE.BoxGeometry(1.2, 0.35, 0.88);
        const roof = new THREE.Mesh(roofGeo, bodyMat);
        roof.position.set(-0.05, 1.1, 0);
        car.add(roof);

        // 前保险杠
        const bumperF = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.25, 1.08), blackMat);
        bumperF.position.set(1.3, 0.35, 0); car.add(bumperF);

        // 后保险杠
        const bumperR = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.3, 1.05), blackMat);
        bumperR.position.set(-1.32, 0.38, 0); car.add(bumperR);

        // 进气格栅
        const grill = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.28, 0.7), blackMat);
        grill.position.set(1.31, 0.52, 0); car.add(grill);

        // 前大灯
        const headlightMat = new THREE.MeshStandardMaterial({ color: 0xffffee, emissive: 0xffffcc, emissiveIntensity: 0.4, metalness: 0.5 });
        [[1.28, 0.6, 0.38], [1.28, 0.6, -0.38]].forEach(p => {
            const light = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.12, 0.18), headlightMat);
            light.position.set(...p); car.add(light);
        });

        // 尾灯
        const taillightMat = new THREE.MeshStandardMaterial({ color: 0xff0000, emissive: 0xff0000, emissiveIntensity: 0.3 });
        [[-1.3, 0.65, 0.35], [-1.3, 0.65, -0.35]].forEach(p => {
            const light = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.1, 0.16), taillightMat);
            light.position.set(...p); car.add(light);
        });

        // ===== 车窗 =====
        // 前挡风玻璃（倾斜）
        const windshield = new THREE.Mesh(new THREE.BoxGeometry(0.02, 0.4, 0.82), glassMat);
        windshield.position.set(0.55, 1.0, 0);
        windshield.rotation.z = -0.3;
        car.add(windshield);

        // 后挡风玻璃
        const rearWindow = new THREE.Mesh(new THREE.BoxGeometry(0.02, 0.35, 0.82), glassMat);
        rearWindow.position.set(-0.65, 1.0, 0);
        rearWindow.rotation.z = 0.25;
        car.add(rearWindow);

        // 侧窗
        [[0.15, 0.95, 0.51], [0.15, 0.95, -0.51]].forEach(p => {
            const sideWin = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.28, 0.02), glassMat);
            sideWin.position.set(...p); car.add(sideWin);
        });

        // ===== 车轮（轮胎+轮毂分离） =====
        const wheelPositions = [[0.75,0.25,0.52], [0.75,0.25,-0.52], [-0.75,0.25,0.52], [-0.75,0.25,-0.52]];
        wheelPositions.forEach(p => {
            const wheelGroup = new THREE.Group();
            wheelGroup.position.set(...p);

            // 轮胎（圆环）
            const tire = new THREE.Mesh(new THREE.TorusGeometry(0.22, 0.1, 12, 24), rubberMat);
            tire.rotation.y = Math.PI / 2;
            wheelGroup.add(tire);

            // 轮毂
            const rim = new THREE.Mesh(new THREE.CylinderGeometry(0.14, 0.14, 0.06, 16), rimMat);
            rim.rotation.z = Math.PI / 2;
            wheelGroup.add(rim);

            // 轮辐
            for (let k = 0; k < 5; k++) {
                const spoke = new THREE.Mesh(new THREE.BoxGeometry(0.02, 0.22, 0.02), rimMat);
                spoke.rotation.z = k * (Math.PI * 2 / 5);
                spoke.rotation.y = Math.PI / 2;
                wheelGroup.add(spoke);
            }

            car.add(wheelGroup);
        });

        // 门把手
        [[0.1, 0.72, 0.52], [0.1, 0.72, -0.52]].forEach(p => {
            const handle = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.03, 0.02), blackMat);
            handle.position.set(...p); car.add(handle);
        });

        // 后视镜
        [[0.45, 0.85, 0.58], [0.45, 0.85, -0.58]].forEach(p => {
            const mirror = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.06, 0.04), bodyMat);
            mirror.position.set(...p); car.add(mirror);
        });

        return car;
    }

    // ========== 汽车工厂 ==========
    function createCarModel() {
        carGroup = new THREE.Group();
        carGroup.userData.isInteractive = true;

        PARTS_DATA.forEach(data => {
            const partGroup = new THREE.Group();
            const metalMat = new THREE.MeshStandardMaterial({ color: data.color, metalness: 0.4, roughness: 0.4 });
            const rubberMat = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.9 });
            const chromeMat = new THREE.MeshStandardMaterial({ color: 0xcccccc, metalness: 0.9, roughness: 0.1 });
            const glassMat = new THREE.MeshStandardMaterial({ color: 0x446688, transparent: true, opacity: 0.35, metalness: 0.9, roughness: 0.05 });

            if (data.id === 'chassis') {
                // 底盘：两根纵梁 + 多根横梁
                const mainBeam = new THREE.Mesh(new THREE.BoxGeometry(5, 0.15, 0.2), metalMat);
                mainBeam.position.z = 0.3; partGroup.add(mainBeam);
                const mainBeam2 = new THREE.Mesh(new THREE.BoxGeometry(5, 0.15, 0.2), metalMat);
                mainBeam2.position.z = -0.3; partGroup.add(mainBeam2);
                for (let i = -2; i <= 2; i++) {
                    const cross = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.1, 1.0), metalMat);
                    cross.position.x = i * 1.2; partGroup.add(cross);
                }
            } else if (data.id === 'engine') {
                // 发动机：V型缸体
                const block = new THREE.Mesh(new THREE.BoxGeometry(1.0, 0.7, 0.7), metalMat);
                partGroup.add(block);
                for (let i = 0; i < 3; i++) {
                    const cyl = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 0.4, 12), chromeMat);
                    cyl.position.set(-0.2 + i * 0.2, 0.45, 0.15);
                    partGroup.add(cyl);
                    const cyl2 = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 0.4, 12), chromeMat);
                    cyl2.position.set(-0.2 + i * 0.2, 0.45, -0.15);
                    partGroup.add(cyl2);
                }
                // 进气管
                const intake = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.1, 0.4), metalMat);
                intake.position.set(0.3, 0.5, 0); partGroup.add(intake);
            } else if (data.id === 'transmission') {
                // 变速箱：圆角长方体
                const box = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.6, 0.6), metalMat);
                partGroup.add(box);
                const detail = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.15, 0.5, 16), chromeMat);
                detail.rotation.z = Math.PI / 2; detail.position.x = 0.3; partGroup.add(detail);
            } else if (data.id === 'body') {
                // 车身外壳：分段组合
                const hood = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.55, 2.2), metalMat);
                hood.position.set(1.3, 0.1, 0); partGroup.add(hood);
                const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.7, 2.1), metalMat);
                cabin.position.set(-0.2, 0.15, 0); partGroup.add(cabin);
                const trunk = new THREE.Mesh(new THREE.BoxGeometry(1.0, 0.5, 2.0), metalMat);
                trunk.position.set(-1.4, 0.05, 0); partGroup.add(trunk);
                const roof = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.3, 1.9), metalMat);
                roof.position.set(-0.2, 0.6, 0); partGroup.add(roof);
            } else if (data.id.startsWith('wheel')) {
                // 车轮：轮胎+轮毂+轮辐
                const tire = new THREE.Mesh(new THREE.TorusGeometry(0.35, 0.15, 12, 24), rubberMat);
                tire.rotation.y = Math.PI / 2; partGroup.add(tire);
                const rim = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.22, 0.1, 16), chromeMat);
                rim.rotation.z = Math.PI / 2; partGroup.add(rim);
                for (let k = 0; k < 5; k++) {
                    const spoke = new THREE.Mesh(new THREE.BoxGeometry(0.02, 0.35, 0.02), chromeMat);
                    spoke.rotation.z = k * (Math.PI * 2 / 5);
                    spoke.rotation.y = Math.PI / 2;
                    partGroup.add(spoke);
                }
            } else if (data.id === 'seat') {
                // 座椅：坐垫+靠背+头枕
                const cushion = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.15, 0.7), metalMat);
                cushion.position.y = -0.15; partGroup.add(cushion);
                const back = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.7, 0.65), metalMat);
                back.position.set(-0.3, 0.25, 0); partGroup.add(back);
                const headrest = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.15, 0.35), metalMat);
                headrest.position.set(-0.3, 0.65, 0); partGroup.add(headrest);
            } else if (data.id === 'steering') {
                // 方向盘：圆环+辐条+中心
                const ring = new THREE.Mesh(new THREE.TorusGeometry(0.25, 0.03, 8, 24), metalMat);
                partGroup.add(ring);
                const center = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 0.05, 12), metalMat);
                center.rotation.x = Math.PI / 2; partGroup.add(center);
                for (let k = 0; k < 3; k++) {
                    const spoke = new THREE.Mesh(new THREE.BoxGeometry(0.02, 0.22, 0.02), metalMat);
                    spoke.rotation.z = k * (Math.PI * 2 / 3);
                    partGroup.add(spoke);
                }
                // 转向柱
                const column = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 0.4, 8), metalMat);
                column.position.y = -0.3; partGroup.add(column);
            } else if (data.id === 'headlight') {
                // 大灯：透镜形状
                const housing = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.18, 0.12), metalMat);
                partGroup.add(housing);
                const lens = new THREE.Mesh(new THREE.SphereGeometry(0.1, 16, 12, 0, Math.PI * 2, 0, Math.PI / 2), chromeMat);
                lens.position.x = 0.12; lens.rotation.z = -Math.PI / 2; partGroup.add(lens);
            } else if (data.id === 'taillight') {
                // 尾灯
                const housing = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.15, 0.1), metalMat);
                partGroup.add(housing);
                const lens = new THREE.Mesh(new THREE.SphereGeometry(0.08, 16, 12, 0, Math.PI * 2, 0, Math.PI / 2), chromeMat);
                lens.position.x = -0.1; lens.rotation.z = Math.PI / 2; partGroup.add(lens);
            } else if (data.id === 'windshield') {
                // 挡风玻璃：倾斜透明板
                const glass = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.7, 1.6), glassMat);
                partGroup.add(glass);
            } else {
                // 默认
                const box = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), metalMat);
                partGroup.add(box);
            }

            partGroup.position.set(data.pos.x, data.pos.y, data.pos.z);
            if (data.rotation) {
                partGroup.rotation.set(data.rotation.x, data.rotation.y, data.rotation.z);
            }
            partGroup.traverse(child => {
                if (child.isMesh) {
                    child.castShadow = true;
                    child.receiveShadow = true;
                }
            });

            partGroup.userData.isCarPart = true;
            partGroup.userData.partData = data;
            partGroup.userData.originalPos = { ...data.pos };
            partGroup.userData.explodePos = { ...data.explode };
            partGroup.userData.isExploded = false;
            partGroup.userData.isAssembled = true;

            carGroup.add(partGroup);
            carParts.push(partGroup);
        });

        scene.add(carGroup);
    }

    // ========== 拆解 / 组装 ==========
    function toggleDisassemble() {
        if (!carGroup) return;
        disassembled = !disassembled;
        assembleMode = false;
        document.getElementById('btnDisassemble').classList.toggle('active', disassembled);
        document.getElementById('btnAssemble').classList.remove('active');

        carParts.forEach(part => {
            const data = part.userData.partData;
            if (disassembled) {
                part.userData.isExploded = true;
                part.userData.isAssembled = false;
                animatePartTo(part, data.explode);
            } else {
                part.userData.isExploded = false;
                part.userData.isAssembled = true;
                animatePartTo(part, data.pos);
            }
        });

        showToast(disassembled ? '🔧 汽车已拆解！点击零件查看介绍' : '✅ 汽车已复原');
    }

    function toggleAssemble() {
        if (!carGroup) return;
        if (!disassembled) {
            toggleDisassemble(); // 先拆解
        }
        assembleMode = !assembleMode;
        document.getElementById('btnAssemble').classList.toggle('active', assembleMode);

        if (assembleMode) {
            showToast('🔩 组装模式：点击散落的零件，再点击汽车上的正确位置来安装！');
            // 重置所有零件为未组装
            carParts.forEach(part => {
                part.userData.isAssembled = false;
                setPartEmissive(part, 0x444444, 0.2);
            });
            assembledCount = 0;
            updateProgress();
        } else {
            carParts.forEach(part => {
                setPartEmissive(part, 0x000000, 0);
            });
        }
    }

    function animatePartTo(mesh, target) {
        const start = { x: mesh.position.x, y: mesh.position.y, z: mesh.position.z };
        const duration = 800;
        const startTime = Date.now();

        function step() {
            const elapsed = Date.now() - startTime;
            const t = Math.min(elapsed / duration, 1);
            const ease = 1 - Math.pow(1 - t, 3);
            mesh.position.x = start.x + (target.x - start.x) * ease;
            mesh.position.y = start.y + (target.y - start.y) * ease;
            mesh.position.z = start.z + (target.z - start.z) * ease;
            if (t < 1) requestAnimationFrame(step);
        }
        step();
    }

    function resetCar() {
        if (controls) {
            controls.target.set(0, 1, 0);
        }
        new TWEEN_Camera(camera, { x: 8, y: 6, z: 10 });
    }

    function TWEEN_Camera(cam, target) {
        const start = { x: cam.position.x, y: cam.position.y, z: cam.position.z };
        const duration = 1000;
        const startTime = Date.now();
        function step() {
            const elapsed = Date.now() - startTime;
            const t = Math.min(elapsed / duration, 1);
            const ease = 1 - Math.pow(1 - t, 3);
            cam.position.x = start.x + (target.x - start.x) * ease;
            cam.position.y = start.y + (target.y - start.y) * ease;
            cam.position.z = start.z + (target.z - start.z) * ease;
            if (t < 1) requestAnimationFrame(step);
        }
        step();
    }

    // ========== 点击交互 ==========
    function onCanvasClick(event) {
        mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
        mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
        raycaster.setFromCamera(mouse, camera);

        if (currentMode === 'brand') {
            const intersects = raycaster.intersectObjects(brandMeshes, true);
            if (intersects.length > 0) {
                let obj = intersects[0].object;
                while (obj.parent && !obj.userData.brand) {
                    obj = obj.parent;
                }
                if (obj.userData.brand) {
                    showBrandInfo(obj.userData.brand);
                }
            }
        } else if (currentMode === 'factory') {
            const intersects = raycaster.intersectObjects(carParts, true);
            if (intersects.length > 0) {
                let obj = intersects[0].object;
                while (obj.parent && !obj.userData.isCarPart) {
                    obj = obj.parent;
                }
                if (obj.userData.isCarPart) {
                    handlePartClick(obj);
                }
            }
        }
    }

    function onCanvasMove(event) {
        mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
        mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
        raycaster.setFromCamera(mouse, camera);

        if (currentMode === 'factory') {
            const intersects = raycaster.intersectObjects(carParts, true);
            carParts.forEach(p => {
                if (!p.userData.isAssembled) {
                    setPartEmissive(p, 0x000000, 0);
                }
            });
            if (intersects.length > 0) {
                let p = intersects[0].object;
                while (p.parent && !p.userData.isCarPart) {
                    p = p.parent;
                }
                if (p.userData.isCarPart && !p.userData.isAssembled) {
                    setPartEmissive(p, 0x4ECDC4, 0.3);
                }
                document.body.style.cursor = 'pointer';
            } else {
                document.body.style.cursor = 'default';
            }
        }
    }

    function setPartEmissive(part, color, intensity) {
        part.traverse(child => {
            if (child.isMesh && child.material) {
                child.material.emissive = new THREE.Color(color);
                child.material.emissiveIntensity = intensity;
            }
        });
    }

    function handlePartClick(part) {
        const data = part.userData.partData;

        if (assembleMode && !part.userData.isAssembled) {
            // 组装这个零件
            part.userData.isAssembled = true;
            part.userData.isExploded = false;
            setPartEmissive(part, 0x000000, 0);
            animatePartTo(part, data.pos);
            assembledCount++;
            updateProgress();
            showToast('✅ ' + data.nameCN + ' ' + data.nameEN + ' 安装成功！');
            speakText(data.nameCN + '，' + data.nameEN);

            if (assembledCount >= carParts.length) {
                celebrate('🎉 太棒了！你成功组装了整辆汽车！');
                assembleMode = false;
                document.getElementById('btnAssemble').classList.remove('active');
                disassembled = false;
                document.getElementById('btnDisassemble').classList.remove('active');
            }
        } else if (!assembleMode) {
            // 显示零件信息
            showPartInfo(data);
            speakText(data.nameCN + '。' + data.descCN);
        }
    }

    function showBrandInfo(brand) {
        document.getElementById('infoTitle').innerHTML = '🏢 ' + brand.nameCN;
        document.getElementById('infoEn').textContent = brand.nameEN;
        document.getElementById('infoDesc').innerHTML =
            '📍 ' + brand.countryCN + ' ' + brand.countryEN + '<br>' +
            '📅 创立于 ' + brand.founded + ' 年<br><br>' +
            '💬 "' + brand.sloganCN + '"<br>' +
            '🚗 代表车型：' + brand.models.join('、') + '<br><br>' +
            brand.descCN;
        document.getElementById('infoDescEn').innerHTML = brand.descEN;
        document.getElementById('infoPanel').classList.add('active');
        speakText(brand.nameCN + '，' + brand.countryCN + '品牌，' + brand.descCN.substring(0, 60) + '...');
    }

    function showPartInfo(data) {
        document.getElementById('infoTitle').textContent = '🔧 ' + data.nameCN;
        document.getElementById('infoEn').textContent = data.nameEN;
        document.getElementById('infoDesc').textContent = data.descCN;
        document.getElementById('infoDescEn').textContent = data.descEN;
        document.getElementById('infoPanel').classList.add('active');
    }

    function closeInfo() {
        stopSpeech();
        document.getElementById('infoPanel').classList.remove('active');
        // 品牌模式下，关闭后回到品牌展厅全景
        if (currentMode === 'brand') {
            if (controls) {
                new TWEEN_Camera(camera, { x: 0, y: 8, z: 22 });
                new TWEEN_ControlsTarget(controls, { x: 0, y: 0, z: 0 });
            }
        }
    }

    function TWEEN_ControlsTarget(controls, target) {
        const start = { x: controls.target.x, y: controls.target.y, z: controls.target.z };
        const duration = 800;
        const startTime = Date.now();
        function step() {
            const elapsed = Date.now() - startTime;
            const t = Math.min(elapsed / duration, 1);
            const ease = 1 - Math.pow(1 - t, 3);
            controls.target.x = start.x + (target.x - start.x) * ease;
            controls.target.y = start.y + (target.y - start.y) * ease;
            controls.target.z = start.z + (target.z - start.z) * ease;
            if (t < 1) requestAnimationFrame(step);
        }
        step();
    }

    // ========== 品牌问答 ==========
    function startBrandQuiz() {
        quizIndex = 0;
        quizScore = 0;
        showQuizQuestion();
    }

    function showQuizQuestion() {
        if (quizIndex >= BRANDS.length) {
            showQuizResult();
            return;
        }
        const brand = BRANDS[quizIndex];
        const wrongOptions = BRANDS.filter(b => b.id !== brand.id)
            .sort(() => Math.random() - 0.5).slice(0, 3);
        const options = [...wrongOptions, brand].sort(() => Math.random() - 0.5);

        const card = document.getElementById('quizCard');
        card.innerHTML =
            '<h2>🎯 品牌识别挑战 ' + (quizIndex + 1) + '/' + BRANDS.length + '</h2>' +
            '<div class="quiz-en">Which brand is from ' + brand.countryEN + ' and founded in ' + brand.founded + '?</div>' +
            '<div class="quiz-en" style="font-size:1rem;color:#666;margin-bottom:10px;">' +
            '哪个品牌来自' + brand.countryCN + '，创立于' + brand.founded + '年？</div>' +
            '<div class="quiz-options">' +
            options.map((opt, i) =>
                '<div class="quiz-option" onclick="answerQuiz(\'' + opt.id + '\', \'' + brand.id + '\', this)">' +
                '<div style="font-size:1.4rem;margin-bottom:4px;">' + getBrandEmoji(opt.id) + '</div>' +
                opt.nameCN + '<br><small style="color:#888">' + opt.nameEN + '</small></div>'
            ).join('') +
            '</div>' +
            '<div class="quiz-result" id="quizResult"></div>' +
            '<button class="quiz-next" id="quizNext" style="display:none;" onclick="nextQuiz()">下一题 Next →</button>';

        document.getElementById('quizPanel').classList.add('active');
    }

    function getBrandEmoji(id) {
        const map = { bmw:'🔵', mercedes:'⭐', audi:'⭕', toyota:'🔴', byd:'🟢', tesla:'⚡' };
        return map[id] || '🚗';
    }

    function answerQuiz(selected, correct, el) {
        const options = document.querySelectorAll('.quiz-option');
        options.forEach(opt => opt.style.pointerEvents = 'none');

        if (selected === correct) {
            el.classList.add('correct');
            document.getElementById('quizResult').innerHTML = '✅ 回答正确！Correct！';
            quizScore++;
            speakText('回答正确！');
        } else {
            el.classList.add('wrong');
            options.forEach(opt => {
                if (opt.innerHTML.includes(BRANDS.find(b => b.id === correct).nameCN)) {
                    opt.classList.add('correct');
                }
            });
            document.getElementById('quizResult').innerHTML = '❌ 再想想！正确答案是 ' + BRANDS.find(b => b.id === correct).nameCN;
            speakText('再想想！正确答案是' + BRANDS.find(b => b.id === correct).nameCN);
        }
        document.getElementById('quizNext').style.display = 'inline-block';
    }

    function nextQuiz() {
        quizIndex++;
        showQuizQuestion();
    }

    function showQuizResult() {
        const card = document.getElementById('quizCard');
        const stars = '⭐'.repeat(Math.ceil(quizScore / BRANDS.length * 5));
        card.innerHTML =
            '<h2>🎉 挑战完成！Challenge Complete!</h2>' +
            '<div style="font-size:4rem;margin:20px 0;">' + stars + '</div>' +
            '<div style="font-size:1.4rem;color:var(--dark);">' +
            '你答对了 ' + quizScore + ' / ' + BRANDS.length + ' 题<br>' +
            'You got ' + quizScore + ' out of ' + BRANDS.length + ' correct!' +
            '</div>' +
            '<button class="quiz-next" style="margin-top:30px;" onclick="closeQuiz()">完成 Done</button>';
        speakText('挑战完成！你答对了' + quizScore + '题！');
    }

    function closeQuiz() {
        stopSpeech();
        document.getElementById('quizPanel').classList.remove('active');
    }

    // ========== 进度更新 ==========
    function updateProgress() {
        const pct = (assembledCount / carParts.length) * 100;
        document.getElementById('progressFill').style.width = pct + '%';
        document.getElementById('progressText').textContent = assembledCount + ' / ' + carParts.length + ' 个零件 Parts';
    }

    // ========== 语音播报 ==========
    function speakText(text) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const utter = new SpeechSynthesisUtterance(text);
            utter.lang = 'zh-CN';
            utter.rate = 0.9;
            window.speechSynthesis.speak(utter);
        }
    }

    function stopSpeech() {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
        }
    }

    // 页面隐藏/切换时停止语音
    document.addEventListener('visibilitychange', () => {
        if (document.hidden) stopSpeech();
    });

    // 浏览器回退/前进时停止语音
    window.addEventListener('popstate', stopSpeech);

    // 页面关闭/刷新前停止语音
    window.addEventListener('beforeunload', stopSpeech);

    // ========== Toast ==========
    function showToast(msg) {
        const toast = document.getElementById('toast');
        toast.textContent = msg;
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 3000);
    }

    // ========== 庆祝动画 ==========
    function celebrate(text) {
        const el = document.getElementById('celebration');
        document.getElementById('celebrationText').textContent = text;
        el.classList.add('active');
        setTimeout(() => el.classList.remove('active'), 3000);
    }

    // ========== 启动 ==========
    window.addEventListener('load', () => {
        initThree();
        setTimeout(() => {
            document.getElementById('loadingScreen').classList.add('hidden');
        }, 1500);
    });
    </script>
</body>
</html>
